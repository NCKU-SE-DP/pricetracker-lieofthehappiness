name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'refactor/overall'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74136869]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up virtual environment and install dependencies
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock pytest-cov



      - name: Run crawler tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |

          .\venv\Scripts\activate
          cd backend
          pytest tests/crawler --cov=src --cov-report=xml --disable-warnings

      - name: Run llm_clients tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |

          .\venv\Scripts\activate
          cd backend
          pytest tests/llm_clients --cov=src --cov-report=xml --disable-warnings
      
      - name: Run database tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          .\venv\Scripts\activate
          cd backend
          pytest tests/database --cov=src --cov-report=xml --disable-warnings

      - name: Run integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |

          .\venv\Scripts\activate
          cd backend
          pytest tests/integration --cov=src --cov-report=xml --disable-warnings
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml



